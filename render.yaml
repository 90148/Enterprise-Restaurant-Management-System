services:
  # 1. Java Spring Boot Backend Service
  - type: web
    name: resto-backend
    env: docker
    dockerfilePath: Dockerfile
    context: .
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: resto-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://resto-frontend.onrender.com,http://localhost:3000

  # 2. React Vite Frontend Service
  - type: web
    name: resto-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    context: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://resto-backend.onrender.com/api

databases:
  # 3. PostgreSQL Database
  - name: resto-postgres
    databaseName: restaurant_db
    user: resto_user
    plan: free
