spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:restaurant_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false # in dev memory mode hibernate manages schema; flyway enabled in prod or when external PG is provided

logging:
  level:
    org.hibernate.SQL: INFO
